<div class="space-y-6">

  <!-- Tab Switcher -->
  <div class="flex border-b border-gray-300">
    <button
      (click)="setTab('today')"
      [class]="'py-2 px-4 text-sm font-medium border-b-2 transition-colors ' + (activeTab === 'today' ? 'border-royal text-royal' : 'border-transparent text-gray-500 hover:text-gray-700')"
    >
      Today
    </button>
    <button
      (click)="setTab('upcoming')"
      [class]="'py-2 px-4 text-sm font-medium border-b-2 transition-colors ' + (activeTab === 'upcoming' ? 'border-royal text-royal' : 'border-transparent text-gray-500 hover:text-gray-700')"
    >
      Upcoming Week
    </button>
  </div>

  <!-- Appointments Table -->
  <div class="bg-white rounded-lg shadow-md overflow-hidden p-6">
    <h3 class="text-lg font-bold text-royal mb-4">{{ scheduleTitle }}</h3>

    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Patient Name</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">File No.</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Reason</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
            <th class="relative px-6 py-3"><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <ng-container *ngIf="filtered.length > 0; else noAppointments">
            <tr *ngFor="let appt of filtered" class="hover:bg-gray-50 transition-colors">
              <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ appt.time }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">{{ appt.patient }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ appt.fileNo }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ appt.reason }}</td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span [class]="'px-2 inline-flex text-xs leading-5 font-semibold rounded-full ' + statusClass(appt.status)">
                  {{ appt.status }}
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                <ng-container *ngIf="appt.status === 'Scheduled'">
                  <button (click)="updateStatus(appt.id, 'Completed')"
                          class="text-green-700 hover:text-green-900 border border-green-200 bg-green-50 px-3 py-1 rounded text-xs font-bold hover:bg-green-100 mr-1">
                    Complete
                  </button>
                  <button (click)="updateStatus(appt.id, 'No Show')"
                          class="text-yellow-700 hover:text-yellow-900 border border-yellow-200 bg-yellow-50 px-3 py-1 rounded text-xs font-bold hover:bg-yellow-100">
                    No Show
                  </button>
                </ng-container>
                <span *ngIf="appt.status !== 'Scheduled'" class="text-xs text-gray-400 italic">—</span>
              </td>
            </tr>
          </ng-container>
          <ng-template #noAppointments>
            <tr>
              <td colspan="6" class="text-center py-8 text-gray-500">No appointments scheduled.</td>
            </tr>
          </ng-template>
        </tbody>
      </table>
    </div>
  </div>

</div>
