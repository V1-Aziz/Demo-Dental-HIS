<div class="space-y-8">

  <!-- Request Form -->
  <section class="bg-white rounded-lg shadow-md p-6">
    <h3 class="text-lg font-bold text-royal mb-6 pb-2 border-b border-gray-200 uppercase tracking-tight">Request New Item</h3>

    <form (ngSubmit)="submitRequest()">

      <div *ngIf="submitSuccess" class="mb-4 px-4 py-2.5 bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg">
        Request submitted successfully.
      </div>
      <div *ngIf="submitError" class="mb-4 px-4 py-2.5 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg">
        {{ submitError }}
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-gray-700">Item Name</label>
          <select [(ngModel)]="selectedItemId" name="selectedItemId" required
                  class="w-full bg-white text-gray-900 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-royal/20 focus:border-royal outline-none transition-all text-sm appearance-none cursor-pointer">
            <option [ngValue]="null" disabled>Select an item...</option>
            <option *ngFor="let item of items" [ngValue]="item.id">{{ item.name }}</option>
          </select>
        </div>
        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-gray-700">Quantity</label>
          <input type="number" [(ngModel)]="quantity" name="quantity" min="1" required
                 class="w-full bg-white text-gray-900 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-royal/20 focus:border-royal outline-none transition-all placeholder:text-gray-400 text-sm" />
        </div>
      </div>

      <div class="mb-6 space-y-1.5">
        <label class="block text-sm font-semibold text-gray-700">Notes</label>
        <textarea rows="4" [(ngModel)]="notes" name="notes"
                  placeholder="Provide additional details or specifications..."
                  class="w-full bg-white text-gray-900 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-royal/20 focus:border-royal outline-none transition-all placeholder:text-gray-400 text-sm resize-none"></textarea>
      </div>

      <div class="flex justify-end pt-2">
        <button type="submit" [disabled]="submitting || !selectedItemId || quantity < 1"
                class="bg-royal text-white font-bold py-2.5 px-8 rounded-lg hover:bg-[#2c5282] active:scale-95 transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
          {{ submitting ? 'Submitting…' : 'Submit Request' }}
        </button>
      </div>
    </form>
  </section>

  <!-- Request History -->
  <section class="bg-white rounded-lg shadow-md overflow-hidden">
    <div class="p-4 border-b border-gray-200">
      <h3 class="text-lg font-bold text-royal">My Request History</h3>
    </div>
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Request Date</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Item</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quantity</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200 text-sm">
          <tr *ngFor="let req of history" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 whitespace-nowrap text-gray-900">{{ req.date }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-gray-600">{{ req.item }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-gray-600">{{ req.qty }}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span [class]="'px-2 inline-flex text-xs leading-5 font-semibold rounded-full ' + statusClass(req.status)">
                {{ req.status }}
              </span>
            </td>
          </tr>
          <tr *ngIf="history.length === 0">
            <td colspan="4" class="px-6 py-8 text-center text-gray-400">No requests submitted yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</div>
