<div class="flex h-screen overflow-hidden bg-[#e2e8f0]">

  <!-- Mobile Overlay -->
  <div *ngIf="isSidebarOpen"
       class="fixed inset-0 bg-black/50 z-40 md:hidden"
       (click)="isSidebarOpen = false">
  </div>

  <!-- Sidebar -->
  <aside [class]="'fixed inset-y-0 left-0 z-50 w-64 h-screen overflow-y-auto bg-royal text-white flex flex-col justify-between p-4 transform transition-transform duration-300 ease-in-out ' + (isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0')">
    <div>
      <!-- Logo -->
      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-24 h-24 rounded-full mb-4 border-4 border-gold bg-white p-1 flex items-center justify-center overflow-hidden">
          <span class="text-royal font-bold text-2xl">DC</span>
        </div>
        <h2 class="text-xl font-bold">College of Dentistry</h2>
        <p class="text-sm text-gray-300">Student Portal</p>
      </div>

      <!-- Nav -->
      <nav>
        <ul class="space-y-2">
          <li *ngFor="let item of menuItems">
            <button
              (click)="navigate(item)"
              [class]="'w-full flex items-center py-2.5 px-4 rounded-lg transition-all duration-200 ' + (isActive(item) ? 'bg-gold text-royal font-semibold' : 'text-gray-300 hover:bg-white/10 hover:text-white')"
            >
              <span [class]="'material-symbols-outlined text-xl mr-3 ' + (isActive(item) ? 'text-royal' : '')">{{ item.icon }}</span>
              {{ item.label }}
            </button>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Profile + Logout -->
    <div class="border-t border-white/20 pt-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <div class="h-10 w-10 rounded-full bg-gold flex items-center justify-center text-royal font-bold">SA</div>
          <div class="ml-3">
            <p class="font-semibold text-sm">Saleh Al-Amri</p>
            <p class="text-xs text-gray-400">Dental Student</p>
          </div>
        </div>
        <button (click)="logout()" class="text-gray-400 hover:text-white transition-colors" title="Logout">
          <span class="material-symbols-outlined text-xl">logout</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col md:ml-64 h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-white shadow-sm p-4 flex items-center justify-between z-30 flex-shrink-0">
      <div class="flex items-center">
        <button (click)="isSidebarOpen = true" class="md:hidden text-gray-600 mr-4 p-1 rounded hover:bg-gray-100">
          <span class="material-symbols-outlined text-2xl">menu</span>
        </button>
        <div>
          <h1 class="text-royal text-xl font-bold">{{ pageTitle }}</h1>
          <p class="text-sm text-gray-500 hidden sm:block">{{ pageSubtitle }}</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <app-live-clock></app-live-clock>
        <!-- Notification Bell -->
        <div class="relative">
          <button class="notif-bell relative text-gray-400 hover:text-royal transition-colors" (click)="toggleNotif()">
            <span class="material-symbols-outlined text-2xl">notifications</span>
            <span *ngIf="unreadCount > 0"
                  class="absolute -top-1 -right-1 min-w-[18px] h-[18px] bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center px-0.5 border border-white">
              {{ unreadCount > 99 ? '99+' : unreadCount }}
            </span>
          </button>
          <div *ngIf="notifOpen"
               class="notif-panel absolute right-0 mt-2 bg-white rounded-xl shadow-2xl border border-gray-100 flex flex-col z-50"
               style="width:360px;max-height:480px">
            <div class="flex items-center justify-between px-4 py-3 border-b flex-shrink-0">
              <span class="font-semibold text-gray-800 text-sm">Notifications</span>
              <button *ngIf="unreadCount > 0" (click)="markAllRead()" class="text-xs text-blue-600 hover:text-blue-800 font-medium">Mark all as read</button>
            </div>
            <div class="overflow-y-auto flex-1">
              <div *ngIf="notifications.length === 0" class="flex flex-col items-center justify-center py-10 text-gray-400 gap-2">
                <span class="material-symbols-outlined text-4xl">notifications_none</span>
                <span class="text-sm">No notifications yet</span>
              </div>
              <div *ngFor="let n of notifications" (click)="markRead(n)"
                   [class]="'group flex items-start gap-3 px-4 py-3 border-b last:border-0 transition-colors cursor-pointer ' + (n.is_read ? 'bg-white hover:bg-gray-50' : 'bg-blue-50 hover:bg-blue-100')">
                <span [class]="'material-symbols-outlined text-xl mt-0.5 flex-shrink-0 ' + notifColor(n.type)">{{ notifIcon(n.type) }}</span>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-semibold text-gray-800 truncate">{{ n.title }}</p>
                  <p class="text-xs text-gray-600 leading-snug mt-0.5 line-clamp-2">{{ n.message }}</p>
                  <p class="text-xs text-gray-400 mt-0.5">{{ timeAgo(n.created_at) }}</p>
                </div>
                <div class="flex flex-col items-center gap-1 flex-shrink-0">
                  <span *ngIf="!n.is_read" class="w-2 h-2 rounded-full bg-blue-500"></span>
                  <button (click)="dismiss(n, $event)"
                          class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-300 hover:text-red-400"
                          title="Dismiss">
                    <span class="material-symbols-outlined text-base leading-none">close</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-auto p-4 md:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
