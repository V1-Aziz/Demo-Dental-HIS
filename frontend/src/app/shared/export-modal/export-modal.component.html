<div *ngIf="open && config" class="fixed inset-0 z-50 flex items-center justify-center p-4">

  <!-- Backdrop -->
  <div class="absolute inset-0 bg-slate-900/55" (click)="onBackdropClick()"></div>

  <!-- Modal card -->
  <div class="relative bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden"
       role="dialog" aria-modal="true">

    <!-- Header -->
    <div class="flex items-start justify-between px-6 pt-5 pb-3 border-b border-gray-100">
      <div>
        <h2 class="text-lg font-bold text-royal">Export {{ config.title }}</h2>
        <p *ngIf="contextSubtitle" class="text-xs text-gray-500 mt-0.5">{{ contextSubtitle }}</p>
      </div>
      <button type="button"
              (click)="closeModal()"
              [disabled]="isExporting"
              class="text-gray-400 hover:text-gray-600 transition-colors disabled:opacity-50">
        <span class="material-symbols-outlined text-xl leading-none">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-4 space-y-5">

      <!-- Format picker -->
      <div>
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">File format</p>
        <div class="grid grid-cols-3 gap-2">
          <button *ngFor="let opt of formatOptions"
                  type="button"
                  (click)="selectFormat(opt.value)"
                  [disabled]="isExporting"
                  [class]="'relative flex flex-col items-center justify-center gap-1 rounded-lg border px-3 py-3 text-sm transition-all ' +
                           (selectedFormat === opt.value
                             ? 'border-royal bg-royal/5 text-royal'
                             : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300')">
            <span class="material-symbols-outlined text-2xl leading-none">{{ opt.icon }}</span>
            <span class="font-semibold">{{ opt.label }}</span>
            <span class="text-[10px] text-gray-400">{{ opt.description }}</span>
            <span *ngIf="selectedFormat === opt.value"
                  class="absolute -top-1.5 -right-1.5 inline-flex items-center justify-center w-5 h-5 bg-royal text-white rounded-full text-xs">
              <span class="material-symbols-outlined text-sm leading-none">check</span>
            </span>
          </button>
        </div>
      </div>

      <!-- Sections checklist -->
      <div>
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Include in export</p>
        <div class="space-y-2">
          <label *ngFor="let s of sections"
                 [class]="'flex items-start gap-2.5 rounded-lg border px-3 py-2.5 cursor-pointer transition-colors ' +
                          (s.required ? 'bg-slate-50 border-slate-200 cursor-not-allowed'
                                       : (selectedSections[s.key] ? 'border-royal/40 bg-royal/5' : 'border-gray-200 hover:border-gray-300 bg-white'))">
            <input type="checkbox"
                   [checked]="!!selectedSections[s.key]"
                   [disabled]="s.required || isExporting"
                   (change)="toggleSection(s.key)"
                   class="mt-0.5 w-4 h-4 accent-royal cursor-pointer disabled:cursor-not-allowed">
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-gray-800">{{ s.label }}</p>
              <p *ngIf="s.required" class="text-xs text-gray-400 mt-0.5">Always included</p>
            </div>
          </label>
        </div>
      </div>

      <!-- Error -->
      <div *ngIf="errorMessage"
           class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
        {{ errorMessage }}
      </div>

    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-gray-100 bg-gray-50">
      <button type="button"
              (click)="closeModal()"
              [disabled]="isExporting"
              class="px-4 py-1.5 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-white disabled:opacity-50">
        Cancel
      </button>
      <button type="button"
              (click)="onExport()"
              [disabled]="isExporting"
              class="inline-flex items-center gap-1.5 px-4 py-1.5 text-sm font-semibold text-white bg-royal border border-royal rounded-lg hover:bg-royal/90 disabled:opacity-70">
        <span *ngIf="isExporting" class="material-symbols-outlined text-base leading-none animate-spin">progress_activity</span>
        <span *ngIf="!isExporting" class="material-symbols-outlined text-base leading-none">download</span>
        {{ isExporting ? 'Exporting...' : exportLabel }}
      </button>
    </div>

  </div>
</div>
